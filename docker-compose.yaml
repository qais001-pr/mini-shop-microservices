name: microservices

services:
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin-panel
    ports:
      - "3000:80"
    networks:
      - minishop-network
      
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: user-panel
    ports:
      - "3010:80"
    networks:
      - minishop-network

  productservice:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: product-service
    env_file:
      - ./services/product-service/.env
    ports:
      - "3002:3002"
    networks:
      - minishop-network
  userservice:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
      - ./services/user-service/.env
    ports:
      - "3001:3001"
    networks:
      - minishop-network
networks:
  minishop-network:
    driver: bridge
